# HireMyJunior local stack.
#   First run:  pnpm env:init && docker compose up -d --build
#   Stop:       docker compose down        (data kept)
#   Reset:      docker compose down -v     (wipes database + uploads)
#
# Trimmed from supabase/supabase docker/docker-compose.yml: no realtime, edge functions,
# pooler, analytics or imgproxy yet, and a small nginx gateway in place of Envoy.

name: hmj

x-db-env: &db-env
  PGHOST: db
  PGPORT: 5432
  PGDATABASE: postgres
  PGUSER: postgres
  PGPASSWORD: ${POSTGRES_PASSWORD}
  PGOPTIONS: -c client_min_messages=warning

services:
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: ${JWT_EXPIRY}
    volumes:
      - ./docker/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./docker/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    image: supabase/gotrue:v2.196.0
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      mail: { condition: service_started }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${SITE_URL}/**,hiremyjunior://**,exp://**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${SUPABASE_PUBLIC_URL}/auth/v1
      # Email one-time codes. Phone (Twilio Verify) arrives in Phase 3.
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      # Phone sign-in is handled by the phone-login Edge Function (4-digit codes); GoTrue only
      # needs phone identities enabled to hold phone-first accounts and issue their sessions.
      GOTRUE_EXTERNAL_PHONE_ENABLED: "true"
      GOTRUE_SMS_AUTOCONFIRM: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_MAILER_OTP_LENGTH: 6
      GOTRUE_MAILER_OTP_EXP: 600
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOTRUE_SMTP_MAX_FREQUENCY: 5s
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 1000
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: Your HireMyJunior sign-up code
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: Your HireMyJunior sign-in code
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://gateway:8000/email-templates/code.html
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://gateway:8000/email-templates/code.html
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  rest:
    image: postgrest/postgrest:v14.17
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_MAX_ROWS: 1000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
    command: ["postgrest"]
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: supabase/storage-api:v1.74.0
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      rest: { condition: service_started }
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      STORAGE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: hmj
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: local
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - storage-data:/var/lib/storage
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://storage:5000/status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  meta:
    image: supabase/postgres-meta:v0.99.0
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}

  studio:
    image: supabase/studio:2026.09.07-sha-7996410
    restart: unless-stopped
    depends_on:
      meta: { condition: service_started }
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      DEFAULT_ORGANIZATION_NAME: HireMyJunior
      DEFAULT_PROJECT_NAME: hmj-local
      SUPABASE_URL: http://gateway:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      ENABLED_FEATURES_LOGS_ALL: "false"
    ports:
      - "127.0.0.1:${STUDIO_PORT}:3000"

  # API gateway: one origin for auth, REST and storage, like hosted Supabase.
  gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      auth: { condition: service_started }
      rest: { condition: service_started }
      storage: { condition: service_started }
      functions: { condition: service_started }
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
    volumes:
      - ./docker/gateway/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/gateway/email-templates:/usr/share/nginx/email-templates:ro
    ports:
      - "${API_PORT}:8000"

  # Edge Functions: vendor integrations (Twilio, Stripe Identity, Checkr) and their webhooks.
  # Each vendor runs in local-simulation mode until its keys are set in .env.
  functions:
    image: supabase/edge-runtime:v1.76.2
    restart: unless-stopped
    depends_on:
      rest: { condition: service_started }
      auth: { condition: service_started }
    command: ["start", "--main-service", "/home/deno/functions/main"]
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_URL: http://gateway:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SITE_URL: ${SITE_URL}
      MAILPIT_URL: http://mail:8025
      VERIFY_JWT: "false"
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      CHECKR_API_KEY: ${CHECKR_API_KEY:-}
      CHECKR_PACKAGE: ${CHECKR_PACKAGE:-basic_criminal}
      # Local testing only: accept this fixed code for phone sign-in. Ignored when Twilio is set.
      PHONE_LOGIN_TEST_CODE: ${PHONE_LOGIN_TEST_CODE:-}
    volumes:
      - ./supabase/functions:/home/deno/functions:ro
      - deno-cache:/root/.cache/deno

  mail:
    image: axllent/mailpit:v1.29
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:${MAIL_UI_PORT}:8025"

  # One-shot: applies supabase/migrations in order, then exits. Also runs the pgTAP suite:
  #   docker compose run --rm migrate test
  migrate:
    image: supabase/postgres:17.6.1.136
    depends_on:
      db: { condition: service_healthy }
      auth: { condition: service_healthy }
      # Migrations create storage buckets/policies, so storage-api must have made its schema.
      storage: { condition: service_healthy }
    environment: *db-env
    entrypoint: ["bash", "/scripts/migrate.sh"]
    command: ["migrate"]
    volumes:
      - ./docker/migrate/migrate.sh:/scripts/migrate.sh:ro
      - ./supabase:/supabase:ro
    restart: "no"

  # The website (apps/web). Talks to the API from the browser at SUPABASE_PUBLIC_URL and from
  # its own server (session refresh, redirects) over the internal network.
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
    restart: unless-stopped
    environment:
      SUPABASE_INTERNAL_URL: http://gateway:8000
    depends_on:
      migrate: { condition: service_completed_successfully }
      gateway: { condition: service_started }
    ports:
      - "${WEB_PORT}:3000"

volumes:
  deno-cache:
  db-data:
  db-config:
  storage-data:
